soulbound:
  enchantment:
    enabled: true

    recovery-chance:
      level-1: 50
      level-2: 75
      level-3: 100

    enchant-table:
        chances:
            level-1: 15   # Percent chance
            level-2: 7
            level-3: 3
        min-xp:
            level-1: 20
            level-2: 25
            level-3: 30
        #adds percentage to chance for each level to chance of getting soulbound on enchanting table if there is soul sand underneath
        soulsandbonus: 5

    lore:
      title: "&5&lSoulbound {level}"
      line-1: "&7Bound to your soul"
      line-2: "&cChance of recovering on death"

      death-message:
        enabled: true
        text: ",&d but had a soulmate"
        italic: false

  totem:
    enabled: true


debug: false

#do no change, this is used for internal purposes
config-version: 1